<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FAFAFA">
    <title>{% block title %}더벨 News Clipper{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/img/thebell-logo.png">
    <link rel="apple-touch-icon" href="/static/img/thebell-logo.png">
    <link rel="stylesheet" href="/static/css/style.css?v=20260828">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo">
                <img src="/static/img/thebell-logo.png" alt="thebell">
                <span>News Clipper</span>
                <span class="logo-sub">Daily Clipping</span>
            </a>
            <div class="nav-right">
                <a href="/setup" class="btn btn-sm btn-ghost">설정</a>
                <a href="/health" target="_blank" class="btn btn-sm btn-ghost">환경 점검</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>더벨 Daily News Clipping · Gateway to Capital Markets</p>
    </footer>
    <script src="/static/js/app.js?v=20260828"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
