<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#04090A">
    <title>{% block title %}더벨 News Clipper{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/img/thebell-logo.png">
    <link rel="apple-touch-icon" href="/static/img/thebell-logo.png">
    <link rel="stylesheet" href="/static/css/style.css?v=20260828k">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Splash: belt wipe + corner-plus logo + slot counter (once per session) -->
    <div class="pl" id="pl" aria-hidden="true">
        <div class="pl-belts" id="pl-belts">
            <i class="pl-belt"></i><i class="pl-belt"></i><i class="pl-belt"></i>
            <i class="pl-belt"></i><i class="pl-belt"></i><i class="pl-belt"></i>
        </div>
        <div class="pl-center">
            <div class="pl-logo-wrap">
                <div class="pl-logo-box">
                    <img src="/static/img/thebell-logo.png" alt="">
                </div>
                <span class="pl-corner tl">+</span><span class="pl-corner tr">+</span>
                <span class="pl-corner bl">+</span><span class="pl-corner br">+</span>
            </div>
            <div class="pl-tagline" id="pl-tagline">
                <span class="pl-word">COLLECT</span><span class="pl-dot">·</span>
                <span class="pl-word">CLASSIFY</span><span class="pl-dot">·</span>
                <span class="pl-word">CLIP</span>
            </div>
        </div>
        <div class="pl-rail"><span class="pl-rail-fill" id="pl-rail-fill"></span></div>
        <div class="pl-counter" id="pl-counter">
            <span class="pl-reel"><span class="pl-strip" data-d="0"></span></span>
            <span class="pl-reel"><span class="pl-strip" data-d="1"></span></span>
            <span class="pl-reel"><span class="pl-strip" data-d="2"></span></span>
            <span class="pl-pct">%</span>
        </div>
    </div>

    <header>
        <nav>
            <a href="/" class="logo">
                <img src="/static/img/thebell-logo.png" alt="thebell">
                <span>News Clipper</span>
                <span class="logo-sub">Daily Clipping</span>
            </a>
            <div class="nav-right">
                <a href="/setup" class="btn btn-sm btn-ghost">설정</a>
                <a href="/health" target="_blank" class="btn btn-sm btn-ghost">환경 점검</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>더벨 Daily News Clipping · Gateway to Capital Markets</p>
    </footer>
    <script src="/static/js/app.js?v=20260828k"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
