{% extends "base.html" %}
{% block title %}Index 검수 - 더벨 News Clipper{% endblock %}
{% block head %}
<script src="/static/js/vendor/sortable.min.js"></script>
{% endblock %}

{% block content %}
<div class="container ri-container">
    <div class="ri-header">
        <div>
            <h1>목차를 확인해 주세요</h1>
            <p>여러 개를 선택해 한 번에 옮기거나, 끌어서 순서를 바꿀 수 있어요.</p>
        </div>
        <div class="row">
            <button class="btn btn-sm btn-ghost" id="btn-back" onclick="goBackToReview()">기사 선택</button>
            <button class="btn btn-sm btn-warning" id="btn-reclassify" onclick="handleReclassify()">AI 재분류</button>
        </div>
    </div>

    <nav class="ri-nav" id="section-nav"></nav>

    <div class="ri-toolbar">
        <span class="ri-toolbar-hint">
            기사를 클릭해 선택하세요. <kbd>Shift</kbd>+클릭으로 범위, <kbd>Ctrl</kbd>+클릭으로 개별 선택.
        </span>
        <span class="spacer"></span>
        <button class="btn btn-sm btn-ghost" onclick="toggleAllSections()" id="btn-collapse">전체 접기</button>
        <button class="btn btn-sm btn-ghost" onclick="toggleDensity()" id="btn-density">간략히 보기</button>
    </div>

    <div id="classification-tree"></div>

    <!-- Bulk bar: appears only while something is selected -->
    <div class="ri-bulk" id="bulk-bar">
        <span class="ri-bulk-count"><strong id="bulk-n">0</strong>개 선택됨</span>
        <span class="spacer"></span>
        <div class="ri-menu-wrap">
            <button class="btn btn-sm btn-primary" onclick="toggleMoveMenu(event)">여기로 이동 ▾</button>
            <div class="ri-menu" id="move-menu"></div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="removeSelected()">제거</button>
        <button class="btn btn-sm btn-ghost" onclick="clearSelection()">해제</button>
    </div>

    <div class="action-bar">
        <button class="btn" onclick="goBackToReview()">뒤로</button>
        <button class="btn btn-primary" id="btn-confirm-bottom">이대로 확정하고 만들기</button>
    </div>

    <div id="finalize-status" style="display: none; margin-top: 20px;">
        <div class="card">
            <div id="wait-mount"></div>
            <div id="finalize-msg" class="hint" style="margin-top: 12px;"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const SESSION_ID = "{{ session.session_id }}";
let treeData = null;
const allSortables = [];

async function loadClassification() {
    const res = await fetch(`/api/classification/${SESSION_ID}`);
    const data = await res.json();
    treeData = data.tree;
    renderTree(treeData);
}

function renderTree(tree) {
    const container = document.getElementById('classification-tree');
    const nav = document.getElementById('section-nav');
    container.innerHTML = '';
    nav.innerHTML = '';

    tree.forEach((cat, catIdx) => {
        const catId = `cat-${catIdx}`;
        const catCard = document.createElement('div');
        catCard.className = `ri-category ri-theme-${catIdx % 8}`;
        catCard.id = catId;
        catCard.dataset.catIdx = catIdx;

        const catHeader = document.createElement('h2');
        catHeader.innerHTML =
            `<span class="ri-cat-name">${catIdx + 1}. ${escapeHtml(cat.name)}</span>` +
            `<button class="ri-collapse" title="접기/펴기">▾</button>`;
        catHeader.querySelector('.ri-collapse')
            .addEventListener('click', () => catCard.classList.toggle('is-collapsed'));
        catCard.appendChild(catHeader);

        // Count articles in this category
        let catArticleCount = (cat.articles || []).length;

        // Direct articles under category (always create list for drop target)
        if (!cat.subcategories || cat.subcategories.length === 0) {
            const list = createSortableList(cat.articles || [], cat.name);
            catCard.appendChild(list);
        }

        if (cat.subcategories) {
            cat.subcategories.forEach((sub, subIdx) => {
                const subSection = document.createElement('div');
                subSection.className = 'ri-subcategory';

                const subHeader = document.createElement('h3');
                subHeader.textContent = `${String.fromCharCode(65 + subIdx)}. ${sub.name}`;
                subSection.appendChild(subHeader);

                if (sub.sub_items && sub.sub_items.length > 0) {
                    sub.sub_items.forEach(si => {
                        const siSection = document.createElement('div');
                        siSection.className = 'ri-subitem';

                        const siHeader = document.createElement('div');
                        siHeader.className = 'ri-subitem-header';
                        siHeader.textContent = `- ${si.name}`;
                        siSection.appendChild(siHeader);

                        catArticleCount += (si.articles || []).length;
                        const list = createSortableList(si.articles || [],
                            `${cat.name} › ${sub.name} › ${si.name}`);
                        siSection.appendChild(list);

                        subSection.appendChild(siSection);
                    });
                }

                // Direct articles under subcategory (always create list for drop target)
                catArticleCount += (sub.articles || []).length;
                const subList = createSortableList(sub.articles || [],
                    `${cat.name} › ${sub.name}`);
                subSection.appendChild(subList);

                catCard.appendChild(subSection);
            });
        }

        container.appendChild(catCard);

        // Nav button
        const navBtn = document.createElement('a');
        navBtn.className = `ri-nav-btn ri-theme-${catIdx % 8}`;
        navBtn.href = `#${catId}`;
        navBtn.innerHTML = `${cat.name}<span class="ri-nav-count">${catArticleCount}</span>`;
        navBtn.addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById(catId).scrollIntoView({ behavior: 'smooth' });
        });
        nav.appendChild(navBtn);
    });

    buildMoveMenu();
    clearSelection();
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

let destSeq = 0;

function createSortableList(articles, label) {
    const list = document.createElement('div');
    list.className = 'ri-article-list';
    list.dataset.dest = 'd' + (destSeq++);
    list.dataset.destLabel = label || '';

    articles.forEach((art, idx) => {
        list.appendChild(createArticleItem(art, idx));
    });

    const sortable = new Sortable(list, {
        group: 'articles',
        handle: '.ri-drag-handle',
        animation: 150,
        ghostClass: 'ri-ghost',
        chosenClass: 'ri-chosen',
        dragClass: 'ri-drag',
        // Long lists mean the drop target is usually off-screen — let the page
        // scroll itself while dragging instead of making the user do it.
        scroll: true,
        scrollSensitivity: 90,
        scrollSpeed: 14,
        forceAutoScrollFallback: true,
        onStart: function() {
            document.querySelectorAll('.ri-article-list').forEach(l => l.classList.add('ri-drop-active'));
        },
        onEnd: function(evt) {
            document.querySelectorAll('.ri-article-list').forEach(l => l.classList.remove('ri-drop-active'));
            if (evt.from) renumberList(evt.from);
            if (evt.to && evt.to !== evt.from) renumberList(evt.to);
            updateNavCounts();
        }
    });
    allSortables.push(sortable);

    return list;
}

function createArticleItem(art, idx) {
    const item = document.createElement('div');
    item.className = 'ri-article-item';
    item.dataset.id = art.id;

    const summary = art.summary ? `<div class="ri-article-summary">${escapeHtml(art.summary)}</div>` : '';
    const catTag = art.category ? `<span class="ri-article-cat-tag">${escapeHtml(art.category)}</span>` : '';

    item.innerHTML = `
        <div class="ri-drag-handle" title="드래그하여 이동">
            <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
                <path d="M7 2a2 2 0 10.001 4.001A2 2 0 007 2zm0 6a2 2 0 10.001 4.001A2 2 0 007 8zm0 6a2 2 0 10.001 4.001A2 2 0 007 14zm6-8a2 2 0 10-.001-4.001A2 2 0 0013 6zm0 2a2 2 0 10.001 4.001A2 2 0 0013 8zm0 6a2 2 0 10.001 4.001A2 2 0 0013 14z"/>
            </svg>
        </div>
        <div class="ri-article-body">
            <div class="ri-article-num">${idx + 1}</div>
            <div class="ri-article-info">
                <div class="ri-article-title">
                    <a href="${escapeHtml(art.url)}" target="_blank">${escapeHtml(art.title)}</a>
                </div>
                ${summary}
            </div>
            ${catTag}
            <button class="ri-delete-btn" title="기사 제거" onclick="removeArticle(this)">
                <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
                    <path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z"/>
                </svg>
            </button>
        </div>
    `;

    item.querySelector('.ri-article-body').addEventListener('click', (e) => {
        if (e.target.closest('a, button')) return;   // links and × keep working
        onItemClick(item, e);
    });
    return item;
}

function removeArticle(btn) {
    const item = btn.closest('.ri-article-item');
    const list = item.closest('.ri-article-list');
    const title = item.querySelector('.ri-article-title a')?.textContent || '';
    if (!confirm(`"${title}" 기사를 제거하시겠습니까?`)) return;
    item.remove();
    if (list) renumberList(list);
    updateNavCounts();
}

function updateNavCounts() {
    const catCards = document.querySelectorAll('.ri-category');
    const navBtns = document.querySelectorAll('.ri-nav-btn');
    catCards.forEach((card, idx) => {
        const count = card.querySelectorAll('.ri-article-item').length;
        const countEl = navBtns[idx]?.querySelector('.ri-nav-count');
        if (countEl) countEl.textContent = count;
    });
}

function renumberList(list) {
    list.querySelectorAll('.ri-article-item').forEach((item, idx) => {
        const numEl = item.querySelector('.ri-article-num');
        if (numEl) numEl.textContent = idx + 1;
    });
}

/* ==========================================================================
   Bulk arrangement — the drag-only flow forces long scrolls once a section has
   more than a screenful of articles. Selecting rows and moving them in one go
   is the desktop-friendly path; dragging stays for fine reordering.
   ========================================================================== */

let lastClicked = null;

function selectedItems() {
    return Array.from(document.querySelectorAll('.ri-article-item.is-sel'));
}

function onItemClick(item, e) {
    const list = item.closest('.ri-article-list');

    if (e.shiftKey && lastClicked && lastClicked.closest('.ri-article-list') === list) {
        const rows = Array.from(list.querySelectorAll('.ri-article-item'));
        const [a, b] = [rows.indexOf(lastClicked), rows.indexOf(item)].sort((x, y) => x - y);
        rows.slice(a, b + 1).forEach(r => r.classList.add('is-sel'));
    } else if (e.ctrlKey || e.metaKey) {
        item.classList.toggle('is-sel');
        lastClicked = item;
    } else {
        const wasOnly = item.classList.contains('is-sel') && selectedItems().length === 1;
        clearSelection();
        if (!wasOnly) { item.classList.add('is-sel'); lastClicked = item; }
    }
    syncSelectionUI();
}

function clearSelection() {
    document.querySelectorAll('.ri-article-item.is-sel')
        .forEach(el => el.classList.remove('is-sel'));
    lastClicked = null;
    syncSelectionUI();
}

function syncSelectionUI() {
    const n = selectedItems().length;
    document.getElementById('bulk-n').textContent = n;
    document.getElementById('bulk-bar').classList.toggle('is-on', n > 0);
    if (n === 0) closeMoveMenu();
}

function buildMoveMenu() {
    const menu = document.getElementById('move-menu');
    if (!menu) return;
    menu.innerHTML = '';
    document.querySelectorAll('.ri-article-list').forEach(list => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'ri-menu-item';
        btn.textContent = list.dataset.destLabel || '(이름 없음)';
        btn.addEventListener('click', () => moveSelectedTo(list));
        menu.appendChild(btn);
    });
}

function toggleMoveMenu(e) {
    e.stopPropagation();
    document.getElementById('move-menu').classList.toggle('is-on');
}
function closeMoveMenu() {
    const m = document.getElementById('move-menu');
    if (m) m.classList.remove('is-on');
}

function moveSelectedTo(targetList) {
    const items = selectedItems();
    if (!items.length) return;
    const touched = new Set([targetList]);
    items.forEach(item => {
        touched.add(item.closest('.ri-article-list'));
        targetList.appendChild(item);          // keeps their current relative order
    });
    touched.forEach(l => l && renumberList(l));
    clearSelection();
    updateNavCounts();
    targetList.closest('.ri-category')?.classList.remove('is-collapsed');
    targetList.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function removeSelected() {
    const items = selectedItems();
    if (!items.length) return;
    if (!confirm(`선택한 ${items.length}개 기사를 목차에서 제거할까요?`)) return;
    const touched = new Set();
    items.forEach(item => {
        touched.add(item.closest('.ri-article-list'));
        item.remove();
    });
    touched.forEach(l => l && renumberList(l));
    clearSelection();
    updateNavCounts();
}

function toggleAllSections() {
    const cards = Array.from(document.querySelectorAll('.ri-category'));
    const collapse = !cards.every(c => c.classList.contains('is-collapsed'));
    cards.forEach(c => c.classList.toggle('is-collapsed', collapse));
    document.getElementById('btn-collapse').textContent = collapse ? '전체 펴기' : '전체 접기';
}

function toggleDensity() {
    const on = document.body.classList.toggle('is-compact');
    document.getElementById('btn-density').textContent = on ? '자세히 보기' : '간략히 보기';
    try { localStorage.setItem('ri-compact', on ? '1' : '0'); } catch (_) {}
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('.ri-menu-wrap')) closeMoveMenu();
    if (!e.target.closest('.ri-article-item, .ri-bulk')) clearSelection();
});
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { clearSelection(); closeMoveMenu(); }
});
try {
    if (localStorage.getItem('ri-compact') === '1') toggleDensity();
} catch (_) {}

function collectTree() {
    const container = document.getElementById('classification-tree');
    const catCards = container.querySelectorAll('.ri-category');

    return treeData.map((cat, catIdx) => {
        const catCard = catCards[catIdx];
        const result = { name: cat.name, articles: [], subcategories: [] };

        const directList = catCard.querySelector(':scope > .ri-article-list');
        if (directList) {
            result.articles = collectArticlesFromList(directList);
        }

        const subSections = catCard.querySelectorAll(':scope > .ri-subcategory');
        if (cat.subcategories) {
            cat.subcategories.forEach((sub, subIdx) => {
                const subSection = subSections[subIdx];
                const subResult = { name: sub.name, articles: [], sub_items: [] };

                const subList = subSection ? subSection.querySelector(':scope > .ri-article-list') : null;
                if (subList) {
                    subResult.articles = collectArticlesFromList(subList);
                }

                const siSections = subSection ? subSection.querySelectorAll(':scope > .ri-subitem') : [];
                if (sub.sub_items) {
                    sub.sub_items.forEach((si, siIdx) => {
                        const siSection = siSections[siIdx];
                        const siResult = { name: si.name, articles: [] };
                        const siList = siSection ? siSection.querySelector('.ri-article-list') : null;
                        if (siList) {
                            siResult.articles = collectArticlesFromList(siList);
                        }
                        subResult.sub_items.push(siResult);
                    });
                }

                result.subcategories.push(subResult);
            });
        }

        return result;
    });
}

function collectArticlesFromList(list) {
    const articles = [];
    list.querySelectorAll('.ri-article-item').forEach(item => {
        const id = item.dataset.id;
        const art = findArticle(id);
        if (art) articles.push(art);
    });
    return articles;
}

function findArticle(id) {
    for (const cat of treeData) {
        for (const a of (cat.articles || [])) { if (a.id === id) return a; }
        for (const sub of (cat.subcategories || [])) {
            for (const a of (sub.articles || [])) { if (a.id === id) return a; }
            for (const si of (sub.sub_items || [])) {
                for (const a of (si.articles || [])) { if (a.id === id) return a; }
            }
        }
    }
    return null;
}

async function handleConfirm() {
    const btns = document.querySelectorAll('#btn-confirm, #btn-confirm-bottom');
    btns.forEach(b => { b.disabled = true; b.textContent = '처리 중...'; });

    const tree = collectTree();

    const res = await fetch(`/api/confirm-index/${SESSION_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tree }),
    });

    if (!res.ok) {
        const err = await res.json();
        alert('오류: ' + (err.detail || '알 수 없는 오류'));
        btns.forEach(b => { b.disabled = false; b.textContent = '이대로 확정하고 만들기'; });
        return;
    }

    document.getElementById('finalize-status').style.display = 'block';
    btns.forEach(b => b.style.display = 'none');

    WaitUX.askNotifyPermission();
    WaitUX.mount(document.getElementById('wait-mount'));
    WaitUX.start('마무리하는 중');

    const evtSource = new EventSource(`/api/progress/${SESSION_ID}`);
    const msgEl = document.getElementById('finalize-msg');

    evtSource.onmessage = function(event) { msgEl.textContent = event.data; };
    evtSource.addEventListener('state', function(event) {
        try { WaitUX.onState(JSON.parse(event.data)); } catch (e) { /* ignore */ }
    });

    evtSource.addEventListener('done', function(event) {
        evtSource.close();
        if (event.data === 'done') {
            WaitUX.finish(true, '완성됐어요!');
            WaitUX.notify('클리핑이 완성됐어요', 'ZIP 파일을 내려받으세요.');
            setTimeout(() => { window.location.href = `/result/${SESSION_ID}`; }, 600);
        } else {
            WaitUX.finish(false, '오류가 발생했어요');
            msgEl.textContent = '오류가 발생했습니다.';
        }
    });

    evtSource.onerror = function() {
        evtSource.close();
        WaitUX.finish(false, '서버 연결이 끊겼어요');
    };
}

async function goBackToReview() {
    if (!confirm('기사 선택 단계로 돌아가시겠습니까? 현재 분류 작업은 유지됩니다.')) return;
    try {
        const res = await fetch(`/api/rewind/${SESSION_ID}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ target_status: 'crawl_done' }),
        });
        if (res.ok) {
            window.location.href = `/review/${SESSION_ID}`;
        } else {
            const data = await res.json();
            alert('오류: ' + (data.detail || '되돌리기 실패'));
        }
    } catch (e) {
        alert('오류: ' + e.message);
    }
}

async function handleReclassify() {
    if (!confirm('AI가 기사를 다시 분류합니다. 현재 수동 편집은 초기화됩니다. 계속하시겠습니까?')) return;

    const btns = document.querySelectorAll('#btn-reclassify, .btn-warning');
    btns.forEach(b => { b.disabled = true; b.textContent = '재분류 중...'; });

    try {
        const res = await fetch(`/api/reclassify/${SESSION_ID}`, { method: 'POST' });
        if (!res.ok) {
            const err = await res.json();
            alert('재분류 오류: ' + (err.detail || '알 수 없는 오류'));
            btns.forEach(b => { b.disabled = false; b.textContent = 'AI 재분류'; });
            return;
        }

        // Show progress
        document.getElementById('finalize-status').style.display = 'block';
        const msgEl = document.getElementById('finalize-msg');
        WaitUX.askNotifyPermission();
        WaitUX.mount(document.getElementById('wait-mount'));
        WaitUX.start('AI가 다시 분류하는 중');

        const evtSource = new EventSource(`/api/progress/${SESSION_ID}`);
        evtSource.onmessage = function(event) { msgEl.textContent = event.data; };
        evtSource.addEventListener('state', function(event) {
            try { WaitUX.onState(JSON.parse(event.data)); } catch (e) { /* ignore */ }
        });
        evtSource.addEventListener('done', function(event) {
            evtSource.close();
            if (event.data === 'review_ready') {
                WaitUX.finish(true, '재분류 완료!');
                WaitUX.notify('재분류가 끝났어요', '새 목차를 확인해 주세요.');
                setTimeout(() => window.location.reload(), 600);
            } else if (event.data === 'error') {
                WaitUX.finish(false, '재분류 중 오류가 발생했어요');
                btns.forEach(b => { b.disabled = false; b.textContent = 'AI 재분류'; });
            }
        });
        evtSource.onerror = function() {
            evtSource.close();
            WaitUX.finish(false, '서버 연결이 끊겼어요');
        };
    } catch (e) {
        alert('오류: ' + e.message);
        btns.forEach(b => { b.disabled = false; b.textContent = 'AI 재분류'; });
    }
}

document.querySelectorAll('#btn-confirm, #btn-confirm-bottom')
    .forEach(b => b.addEventListener('click', handleConfirm));

loadClassification();
</script>
{% endblock %}
